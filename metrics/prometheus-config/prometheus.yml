global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prd-ne-host-metrics"
    static_configs:
      - targets: ['node-exporter-prd:9100']

  - job_name: "prd-ca-container-metrics"
    static_configs:
      - targets: ['cadvisor-prd:8100']
  - job_name: "sbx-ca-container-metrics"
    static_configs:
      - targets: ['10.1050.111:8100']
  - job_name: "sbx-ne-container-metrics"
    static_configs:
      - targets: ['10.1050.111:9100']